plugins {
    id "com.android.application"
    id "kotlin-android"
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

android {
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    namespace 'com.example.bluetooth_print'
    lint {
        disable 'InvalidPackage'
    }
}


dependencies {
    implementation files('libs/gprintersdkv2.jar')
    implementation "androidx.core:core-ktx:1.16.0"
    // Add you local flutter artifact repository here
    implementation files('/Users/oxyfalcon/flutter/bin/cache/artifacts/engine/android-arm64-release/flutter.jar')
}
